name: booknow_mobile
description: "BookNow — booking app for barber shops. Customers book a slot and pay the service fee; owners manage their agenda."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  responsive_layout_kit: ^0.1.1
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  loader_overlay: ^5.0.0
  flutter_native_splash: ^2.4.6

  # State management / DI / navigation
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  get_it: ^8.0.3
  auto_route: ^10.1.0+1

  # Networking
  dio: ^5.4.0
  curl_logger_dio_interceptor: ^1.0.0
  connectivity_plus: ^7.0.0

  # Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0

  # Models / serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.11.0
  collection: ^1.19.1

  # Localization / formatting
  slang_flutter: ^4.8.0
  intl: ^0.20.2

  # Platform services
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_stripe: ^12.6.0
  package_info_plus: ^8.0.0
  device_info_plus: ^11.0.0
  url_launcher: ^6.1.5
  logger: ^2.5.0
  flutter_dotenv: ^6.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_svg: ^2.3.0
  flutter_appauth: ^12.1.0
  latlong2: ^0.10.1
  flutter_map: ^8.3.2
  geolocator: ^14.0.2
  image_picker: ^1.2.4
  app_settings: ^9.0.1
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  auto_route_generator: ^10.0.1
  json_serializable: ^6.6.0
  freezed: ^3.0.0
  slang_build_runner: ^4.8.0
  husky: ^0.1.7

flutter:
  uses-material-design: true

  assets:
    # Declared one by one: a directory entry does not pick up dotfiles.
    - .env.local
    - .env.development
    - .env.production
    - assets/
    - assets/icons/
    - assets/animations/
    - assets/categories/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
