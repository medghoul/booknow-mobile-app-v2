# dart run flutter_native_splash:create
#
# The native launch screen: what the OS draws between tapping the icon and
# Flutter's first frame. Without it that gap is plain white or black.
#
# It is a picture of SplashMark, drawn from the widget itself by
# tool/render_splash.dart. SplashView shows the same thing in the same place,
# so the handoff can't show. Run that tool again after any change to SplashMark.
flutter_native_splash:
  # --bn-bg, light and dark.
  color: "#0F2A4A"
  color_dark: "#111A2E"

  # 288dp at 4x, the Android 12+ canvas, so every platform gets one picture.
  image: assets/splash/splash_light.png
  image_dark: assets/splash/splash_dark.png

  android: true
  ios: true
  web: false

  # Android 12+ draws its own launch screen: one icon on a 288dp canvas, shown
  # through a 192dp circle. All of SplashMark has to fit inside that circle.
  android_12:
    image: assets/splash/splash_a12_light.png
    image_dark: assets/splash/splash_a12_dark.png
    color: "#0F2A4A"
    color_dark: "#111A2E"

  # The status bar stays visible throughout — hiding it here would make it pop
  # back in on the first Flutter frame.
  fullscreen: false
