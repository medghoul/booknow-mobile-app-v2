help:
  screenTitle: Help and contacts
  faqSection: Frequent questions
  needMore: Need anything else?
  faq:
    feeQuestion: Why do I pay €1,49?
    feeAnswer: "It is the booking fee: it holds your place. You pay for the service itself at the shop, as always."
    cancelQuestion: How do I cancel a booking?
    cancelAnswer: "Open the booking and tap Cancel. Up to 2 hours before the start the fee is refunded; later the booking is still cancelled, but the fee is kept. After the start time it can no longer be cancelled."
    refundQuestion: When does the refund arrive?
    refundAnswer: It leaves as soon as you cancel and returns to the same card, usually within a few working days depending on your bank. If the shop cancels, the fee is always refunded.
    lateQuestion: What if I am running late?
    lateAnswer: "Let the shop know. The slot stays yours until the owner marks you as a no-show, which they can do from 15 minutes after the start time: the fee is not refunded in that case."
  callShop: Call the shop
  callShopSubtitle: For hours, services and appointments
  writeUs: Write to BookNow
  writeUsSubtitle: Payments, refunds and the app · within 24 hours
  terms: Terms
  privacy: Privacy
