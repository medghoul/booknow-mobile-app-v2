help:
  screenTitle: Aiuto e contatti
  faqSection: Domande frequenti
  needMore: Serve altro?
  faq:
    feeQuestion: Perché pago €1,49?
    feeAnswer: "È il costo del servizio di prenotazione: blocca il tuo posto. Il servizio lo paghi in negozio, come sempre."
    cancelQuestion: Come annullo una prenotazione?
    cancelAnswer: "Apri la prenotazione e tocca Annulla. Fino a 2 ore prima dell'inizio la commissione viene rimborsata; più tardi la prenotazione si annulla comunque, ma la commissione resta. Dopo l'orario di inizio non si annulla più."
    refundQuestion: Quando arriva il rimborso?
    refundAnswer: Parte appena annulli e torna sulla stessa carta, di solito in pochi giorni lavorativi secondo i tempi della tua banca. Se è il negozio ad annullare, la commissione è sempre rimborsata.
    lateQuestion: Arrivo in ritardo, cosa succede?
    lateAnswer: "Avvisa il negozio. Il posto resta tuo finché il titolare non ti segna come assente, cosa che può fare da 15 minuti dopo l'orario di inizio: in quel caso la commissione non viene rimborsata."
